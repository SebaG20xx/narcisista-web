<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Números narcisistas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand">Números narcisistas - Taller DevOps</span>
            <span class="navbar-text" id="entorno-txt"></span>
        </div>
    </nav>
    <main class="container mt-4" style="max-width: 520px;">
        <p class="text-muted">
            Un número es narcisista si es igual a la suma de sus dígitos elevados a la cantidad de dígitos.
            Ejemplo: 153 = 1³ + 5³ + 3³.
        </p>
        <div class="card mb-3">
            <div class="card-body">
                <h1 class="h5 card-title">Verificar un número</h1>
                <div class="mb-3">
                    <label for="numero-txt" class="form-label">Número</label>
                    <input type="number" class="form-control" id="numero-txt" min="0">
                </div>
                <button class="btn btn-primary w-100" id="verificar-btn">Verificar</button>
                <div class="alert mt-3 d-none" id="resultado-div"></div>
            </div>
        </div>
        <div class="card">
            <div class="card-body">
                <h2 class="h5 card-title">Listar narcisistas</h2>
                <div class="mb-3">
                    <label for="hasta-txt" class="form-label">Hasta el número</label>
                    <input type="number" class="form-control" id="hasta-txt" min="0" value="1000">
                </div>
                <button class="btn btn-secondary w-100" id="listar-btn">Listar</button>
                <div class="alert mt-3 d-none" id="lista-div"></div>
            </div>
        </div>
    </main>
    <script src="js/init.js"></script>
</body>
</html>
